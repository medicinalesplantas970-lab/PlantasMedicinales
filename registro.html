<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NaturalApp | Registro</title>
    <link rel="stylesheet" href="css/naturalapp.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <img class="brand-image" src="imagenes/planta.svg" alt="Ilustración de una planta medicinal" />
      <h1>Crear cuenta</h1>
      <form id="registerForm">
        <label for="name">Nombre completo<input id="name" required autocomplete="name" /></label>
        <label for="email">Correo electrónico<input id="email" type="email" required autocomplete="email" /></label>
        <label for="password">Contraseña<input id="password" type="password" minlength="4" required autocomplete="new-password" /></label>
        <label for="confirmPassword">Confirmar contraseña<input id="confirmPassword" type="password" minlength="4" required autocomplete="new-password" /></label>
        <button type="submit">Registrarme</button>
      </form>
      <p id="formMessage" class="message" aria-live="polite"></p>
      <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a>.</p>
    </main>
    <script src="js/supabase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
